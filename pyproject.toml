[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garmin-readonly-mcp"
version = "0.1.0"
description = "Minimal read-only Garmin Connect sync and MCP over a normalized local cache"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Alex Pope" }]
dependencies = [
  "garminconnect==0.3.10",
  "mcp==2.0.0",
]

[project.scripts]
garmin-readonly-auth = "garmin_readonly_mcp.cli:auth_main"
garmin-readonly-sync = "garmin_readonly_mcp.cli:sync_main"
garmin-readonly-mcp = "garmin_readonly_mcp.server:main"

[dependency-groups]
dev = [
  "mypy>=1.17.0",
  "pip-audit>=2.9.0",
  "pytest>=8.4.0",
  "pytest-cov>=6.2.0",
  "ruff>=0.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_readonly_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["garmin_readonly_mcp"]

[[tool.mypy.overrides]]
module = ["garminconnect"]
ignore_missing_imports = true
